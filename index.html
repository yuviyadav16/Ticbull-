<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticbull Studio - Apps & Creators Hub</title>
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: #111827;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --sub-text: #9ca3af;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Banner Section */
        .banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #000000, #111827, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Header & Logo */
        .header {
            padding: 0 20px 20px 20px;
            text-align: center;
            margin-top: -50px;
        }

        .logo {
            width: 95px;
            height: 95px;
            border-radius: 20px;
            border: 2px solid var(--accent-color);
            background: #000000;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
            object-fit: contain;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 12px 0 4px 0;
            color: #ffffff;
        }

        .tagline {
            color: var(--sub-text);
            font-size: 13px;
            margin: 0;
        }

        /* Search Bar */
        .search-container {
            padding: 0 20px;
            margin: 20px 0;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid #1f2937;
            background: var(--card-bg);
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Categories Horizontal Scroll */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 20px 15px 20px;
        }

        .cat-chip {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid #1f2937;
            color: var(--sub-text);
        }

        .cat-chip.active {
            background: var(--accent-color);
            color: #000000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* App Cards Section */
        .apps-grid {
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #1f2937;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #000;
            border: 1px solid #374151;
            object-fit: cover;
        }

        .app-info {
            flex: 1;
        }

        .app-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 4px 0;
            color: #fff;
        }

        .app-desc {
            font-size: 12px;
            color: var(--sub-text);
            margin: 0;
        }

        .download-btn {
            background: var(--accent-color);
            color: #000;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Header Gradient Banner -->
    <div class="banner"></div>

    <!-- Brand Header -->
    <div class="header">
        <img class="logo" src="logo.png" alt="Ticbull Logo">
        <h1 class="brand-name">TICBULL</h1>
        <p class="tagline">Next-Gen Multi-App & Creator Studio Hub</p>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search Ticbull Apps & Tools...">
    </div>

    <!-- Categories -->
    <div class="category-scroll">
        <div class="cat-chip active">All Apps</div>
        <div class="cat-chip">🎬 Video & Motion</div>
        <div class="cat-chip">📸 Photo & AI</div>
        <div class="cat-chip">🎵 Audio & SFX</div>
        <div class="cat-chip">🛠️ Utilities</div>
    </div>

    <!-- App List -->
    <div class="apps-grid">

        <!-- Featured App 1: Ticbull Studio -->
        <div class="app-card">
            <img class="app-icon" src="logo.png" alt="Ticbull Studio">
            <div class="app-info">
                <h3 class="app-title">Ticbull Studio</h3>
                <p class="app-desc">4K AI Video Editor & Motion FX</p>
            </div>
            <a href="#" class="download-btn">Get App</a>
        </div>

    </div>

</body>
</html>
