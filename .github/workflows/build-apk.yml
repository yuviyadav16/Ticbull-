name: Build MotionTiger Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build MotionTiger Web Package
      run: |
        npm install -g nativefier
        nativefier --name "MotionTiger" "https://yuviyadav16.github.io/Ticbull-/" --platform android --icon "file_000000002ed8820b9f38cc0aed39c58a.png" --disable-dev-tools

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MotionTiger-Pro-APK
        path: ./*.apk
