name: Build MotionTiger Pro Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile MotionTiger Pro Father Engine
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Checkout Repository Code
      uses: actions/checkout@v3

    - name: ☕ Setup Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📱 Setup Android SDK Environment
      uses: android-actions/setup-android@v2

    - name: 🛠️ Generate MotionTiger Android App Engine
      run: |
        mkdir -p android/app/src/main/java/com/ticbull/motiontiger
        mkdir -p android/app/src/main/res/layout
        
        # Build Manifest File
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.ticbull.motiontiger">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />

            <application
                android:allowBackup="true"
                android:label="MotionTiger"
                android:hardwareAccelerated="true"
                android:largeHeap="true"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Build Layout File
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#060913">

            <WebView
                android:id="@+id/motionEngineView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </RelativeLayout>
        EOF

        # Build Java Activity Logic
        cat << 'EOF' > android/app/src/main/java/com/ticbull/motiontiger/MainActivity.java
        package com.ticbull.motiontiger;

        import android.os.Bundle;
        import android.view.View;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.motionEngineView);
                WebSettings settings = webView.getSettings();

                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
                settings.setLoadsImagesAutomatically(true);
                settings.setUseWideViewPort(true);
                settings.setLoadWithOverviewMode(true);
                
                webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                webView.setWebViewClient(new WebViewClient());
                webView.setWebChromeClient(new WebChromeClient());

                webView.loadUrl("https://yuviyadav16.github.io/Ticbull-/");
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: 📦 Compile Native MotionTiger APK
      run: |
        npm install -g @capacitor/cli @capacitor/core @capacitor/android
        npx cap init MotionTiger com.ticbull.motiontiger --web-dir .
        npx cap add android
        cd android
        chmod +x gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: 🔥 Upload Pure MotionTiger Pro APK
      uses: actions/upload-artifact@v3
      with:
        name: MotionTiger-Pro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
